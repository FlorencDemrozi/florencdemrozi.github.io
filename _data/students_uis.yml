# UiS supervised students — MANUAL information (edit freely).
#
# Name, level, year and thesis link are imported automatically every week from
# NVA (nva.sikt.no) into _data/students_nva.yml. This file adds what NVA does not have:
#
#   - programme: shown in the "Programme" column for the student.
#   - name:      the spelling used on the site (NVA spellings vary; a student matches
#                when all words of one name appear in the other).
#   - Students NOT in NVA: give name, programme, level (B.Sc./M.Sc./Ph.D.) and year;
#                they appear with "Manual" in the Source column.

