summary: >
  I am currently a Full Professor in Biomedical Sensing Systems at the
  Department of Electrical Engineering and Computer Science, University of Stavanger, Norway,
  working on Machine Learning, Human Activity Recognition (HAR), Active and Assisted Living (AAL),
  Internet of Medical Things (IoMT), and AI-driven sensor systems for proactive healthcare.
  I obtained my Ph.D. in Computer Science in May 2020 under the supervision of Prof. Graziano
  Pravadelli, with a thesis on "An IoT-based Virtual Coaching System for Assisting Activities of
  Daily Life".

