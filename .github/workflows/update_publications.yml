name: Update Publications (OpenAlex) and Students (NVA)

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write
  actions: write   # to start the deploy workflow after a data update

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "pyyaml==6.0.2"

      # The script exits with an error (and writes nothing) if OpenAlex is unreachable
      # or returns no works, so a failed run never commits partial data.
      - name: Fetch publications and collaborations from OpenAlex
        run: python scripts/fetch_publications.py --collaborations

      # Supervised UiS students from NVA (nva.sikt.no). If NVA is down this step fails
      # without touching the file, and the publication update still goes ahead.
      - name: Fetch supervised students from NVA
        continue-on-error: true
        run: python scripts/fetch_students.py

      - name: Check for changes
        id: diff
        run: |
          git status --short _data scripts/geo_cache.json
          if git diff --quiet -- _data/publications.yml _data/collaborations.json _data/students_nva.yml scripts/geo_cache.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- _data scripts/geo_cache.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml _data/collaborations.json _data/students_nva.yml scripts/geo_cache.json
          git commit -m "chore: auto-update publications, collaborations (OpenAlex) and students (NVA) [$(date +'%Y-%m-%d')]"
          # retry in case someone pushed to main while the job was running
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i), retrying..."; sleep 10
          done
          exit 1

      - name: Redeploy the site
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
