name: News from Telegram

on:
  schedule:
    # Every 10 minutes (GitHub may start scheduled runs a few minutes late)
    - cron: "*/10 * * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write
  actions: write   # to start the deploy workflow after a change

concurrency:
  group: telegram-news
  cancel-in-progress: false

jobs:
  telegram-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "pyyaml==6.0.2"

      # Reads new bot messages, edits _data/cv.yml, commits and pushes, replies.
      # Does nothing if the TELEGRAM_* secrets are not set.
      - name: Process Telegram messages
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python scripts/telegram_news.py

      - name: Redeploy the site
        if: steps.bot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
