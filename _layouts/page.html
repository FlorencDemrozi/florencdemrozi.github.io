---
layout: default
---
<div class="page-hero">
  <div class="page-hero-inner">
    {% if page.kicker %}<div class="page-kicker">{{ page.kicker }}</div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    <div class="page-rule"></div>
  </div>
</div>

<div class="page-body">
  {{ content }}
</div>
