<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="cXQCZEbopcCMYSECtkDV0vBvA2YTMi6TkTZLyKQWLQo" />
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ site.baseurl }}/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // apply the saved colour theme before the page paints
    try { var t = localStorage.getItem("fd-theme"); if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css?v={{ site.time | date: '%s' }}">
  {% seo %}{% comment %} title, description, canonical and social-share tags {% endcomment %}
</head>
<body>

{% include nav.html %}

<main>
  {{ content }}
</main>

{% include footer.html %}

<script src="{{ site.baseurl }}/assets/js/main.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
